<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EXCELSIOR PROD — Connexion WhatsApp Business</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f6f7;margin:0;color:#1f1f1f}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:680px;width:100%;background:#fff;border:1px solid #e3e5e8;border-radius:16px;padding:32px;box-sizing:border-box;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    h1{margin-top:0}
    button{background:#25D366;color:#fff;border:0;border-radius:10px;padding:14px 22px;font-size:18px;font-weight:700;cursor:pointer}
    #status{margin-top:20px;background:#f0f2f5;padding:14px;border-radius:10px;white-space:pre-wrap}
    .small{font-size:13px;color:#65676b}
  </style>
</head>
<body>
  <div id="fb-root"></div>
  <div class="wrap">
    <main class="card">
      <h1>Connexion WhatsApp Business</h1>
      <p>Connecter le numéro WhatsApp Business d’EXCELSIOR PROD à la plateforme Meta.</p>
      <button id="connectBtn">Connecter WhatsApp Business</button>
      <div id="status">Chargement du SDK Meta…</div>
      <p class="small">Gardez votre téléphone avec WhatsApp Business à proximité pendant la procédure.</p>
    </main>
  </div>

  <script>
    const APP_ID = '1609361424180015';
    const CONFIG_ID = '1868981247597743';

    const statusBox = document.getElementById('status');
    const setStatus = (text) => statusBox.textContent = text;

    window.fbAsyncInit = function() {
      FB.init({
        appId: APP_ID,
        cookie: true,
        xfbml: true,
        version: 'v26.0'
      });
      setStatus('Prêt. Cliquez sur « Connecter WhatsApp Business ».');
    };

    (function(d, s, id) {
      let js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.async = true;
      js.defer = true;
      js.crossOrigin = 'anonymous';
      js.src = 'https://connect.facebook.net/fr_FR/sdk.js';
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    window.addEventListener('message', function(event) {
      if (event.origin !== 'https://www.facebook.com' && event.origin !== 'https://web.facebook.com') return;
      let data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return; }
      }
      if (!data || data.type !== 'WA_EMBEDDED_SIGNUP') return;
      if (data.event === 'FINISH' || data.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING') {
        const p = data.data || {};
        let msg = 'Connexion WhatsApp terminée avec Meta.';
        if (p.waba_id) msg += '\nWABA ID : ' + p.waba_id;
        if (p.phone_number_id) msg += '\nPhone Number ID : ' + p.phone_number_id;
        setStatus(msg);
      } else if (data.event === 'CANCEL') {
        setStatus('Connexion interrompue. Vous pouvez recommencer.');
      } else if (data.event === 'ERROR') {
        setStatus('Erreur Meta : ' + ((data.data && data.data.error_message) || 'erreur non détaillée'));
      }
    });

    function launchSignup() {
      if (!window.FB) {
        setStatus('Le SDK Meta n’est pas encore chargé. Attendez quelques secondes puis réessayez.');
        return;
      }
      setStatus('Ouverture de Meta…');
      FB.login(function(response) {
        if (response && response.authResponse && response.authResponse.code) {
          setStatus('Autorisation Meta reçue. Terminez les étapes dans la fenêtre Meta.');
        } else {
          setStatus('La connexion Meta n’a pas été terminée.');
        }
      }, {
        config_id: CONFIG_ID,
        response_type: 'code',
        override_default_response_type: true,
        extras: {
          setup: {},
          featureType: 'whatsapp_business_app_onboarding',
          sessionInfoVersion: '3'
        }
      });
    }

    document.getElementById('connectBtn').addEventListener('click', launchSignup);
  </script>
</body>
</html>
